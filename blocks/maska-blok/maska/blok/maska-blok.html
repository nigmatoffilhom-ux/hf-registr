<!doctype html>
<!--
  fx-maska — AE maska/shape namuna bloki (FX.maska kutubxonasi kerak: host <head> da maska.js, gsap'dan keyin).
  tur: "matn-matte" (matn ichida harakatlanuvchi gradient — alpha matte) | "iris" (aylana maska bilan yumshoq ochilish/yopilish) | "chizilish" (trim paths: tagchiziq + halqa)
  <div data-composition-id="fx-maska" data-composition-src="maska/blok/maska-blok.html"
       data-variable-values='{"tur":"matn-matte","matn":"YO&#39;L","rang1":"#ff5d73","rang2":"#ffd166","rang3":"#2ec4ff"}'
       data-start="0" data-duration="4" data-track-index="5" data-width="1920" data-height="1080"></div>
-->
<html data-composition-variables='[
  {"id":"tur","type":"enum","label":"Tur","default":"matn-matte","options":[{"value":"matn-matte","label":"Matn matte"},{"value":"iris","label":"Iris"},{"value":"chizilish","label":"Chizilish (trim)"}]},
  {"id":"matn","type":"string","label":"Matn","default":"YO`L"},
  {"id":"rang1","type":"color","label":"Rang 1","default":"#ff5d73"},
  {"id":"rang2","type":"color","label":"Rang 2","default":"#ffd166"},
  {"id":"rang3","type":"color","label":"Rang 3","default":"#2ec4ff"},
  {"id":"fon","type":"boolean","label":"To`q fon","default":true}
]'>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
  #root{position:absolute;inset:0;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#fff}
  .mx-fon{position:absolute;inset:0;background:#070a12}
  .mx-g{position:absolute;inset:0;background-size:300% 100%}
  .mx-t{position:absolute;left:0;right:0;top:50%;text-align:center;font-weight:900;line-height:1;white-space:nowrap;transform-origin:50% 50%}
  .mx-sv{position:absolute;left:0;top:0;overflow:visible}
</style>
<div id="root" data-composition-id="fx-maska">
  <div class="mx-fon"></div>
  <div class="mx-g"></div>
  <div class="mx-t"></div>
</div>
<script>
(function(){
  const V = window.__hyperframes.getVariables() || {};
  const r = document.querySelector('#root'), o = r.closest('[data-width]');
  const FW = Number(o && o.getAttribute('data-width')) || r.offsetWidth || 1920, FH = Number(o && o.getAttribute('data-height')) || r.offsetHeight || 1080;
  const tik = FW / FH < 0.8, DUR = Number(o && o.getAttribute('data-duration')) || 4;
  const FM = window.FX.maska, tl = gsap.timeline({ paused: true });
  const tur = V.tur || 'matn-matte', matn = V.matn || 'YO\'L';
  const c1 = V.rang1 || '#ff5d73', c2 = V.rang2 || '#ffd166', c3 = V.rang3 || '#2ec4ff';
  const fon = r.querySelector('.mx-fon'), g = r.querySelector('.mx-g'), tx = r.querySelector('.mx-t');
  if (V.fon === false) fon.style.display = 'none';
  g.style.backgroundImage = `linear-gradient(90deg,${c1},${c2},${c3},${c1},${c2})`;
  // matn o'lchami: kenglik bo'yicha sig'adi (harf kengligi ~0.66em)
  const olc = Math.round(Math.min(FH * (tik ? 0.16 : 0.34), FW * 0.88 / (Math.max(3, matn.length) * 0.66)));
  if (tur === 'matn-matte') {
    tx.style.display = 'none';
    const h = FM.matteMatn(g, { matn, olcham: olc, vazn: 900, W: FW, H: FH, x: FW / 2, y: FH / 2 });
    FM.anim(tl, h, 0.1, { dan: { s: 0.3 }, ga: { s: 1 }, dur: 1.0, ease: 'back.out(1.5)' });
    tl.fromTo(g, { backgroundPositionX: '0%' }, { backgroundPositionX: '100%', duration: DUR, ease: 'none', immediateRender: false }, 0);
    FM.anim(tl, h, DUR - 0.7, { ga: { s: 1.6 }, dur: 0.7, ease: 'power2.in' });
    tl.to(g, { opacity: 0, duration: 0.5, ease: 'power1.in', immediateRender: false }, DUR - 0.5);
  } else if (tur === 'iris') {
    tx.textContent = matn; tx.style.fontSize = olc + 'px'; tx.style.marginTop = (-olc / 2) + 'px'; tx.style.color = '#0b0f1a';
    const pan = document.createElement('div'); pan.style.cssText = 'position:absolute;inset:0'; r.insertBefore(pan, g); pan.appendChild(g); pan.appendChild(tx);
    const h = FM.yarat(pan, { tur: 'aylana', W: FW, H: FH, bosh: { x: FW / 2, y: FH / 2, r: 0 }, feather: 50 });
    const R = Math.hypot(FW, FH) / 2 + 90;
    FM.anim(tl, h, 0.1, { ga: { r: R }, dur: 1.3, ease: 'power3.inOut', feather: 20 });
    FM.anim(tl, h, DUR - 1.3, { ga: { r: 0 }, dur: 1.2, ease: 'power3.inOut', feather: 50 });
  } else { // chizilish
    g.style.display = 'none'; tx.textContent = matn; tx.style.fontSize = olc + 'px'; tx.style.marginTop = (-olc / 2) + 'px';
    tl.fromTo(tx, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out', immediateRender: false }, 0.1);
    const w = Math.min(FW * 0.72, matn.length * olc * 0.54), cx = FW / 2, cy = FH / 2;
    const sv = FM.katlam(r, { W: FW, H: FH }); sv.classList.add('mx-sv');
    const halqa = FM.shakl(sv, { tur: 'ellips', cx, cy, rx: w * 0.62, ry: olc * 0.8, stroke: c2, sw: Math.max(5, olc * 0.045), cap: 'round' });
    const tag = FM.shakl(sv, { tur: 'yol', d: `M${cx - w * 0.5},${cy + olc * 0.62} C${cx - w * 0.2},${cy + olc * 0.5} ${cx + w * 0.2},${cy + olc * 0.76} ${cx + w * 0.5},${cy + olc * 0.6}`, stroke: c1, sw: Math.max(6, olc * 0.06), cap: 'round' });
    FM.trim(tl, halqa, 0.5, { dan: { boshi: 0, oxiri: 0, siljish: 0.62 }, ga: { oxiri: 1 }, dur: 1.2, ease: 'power2.out' });
    FM.trim(tl, tag, 1.5, { dan: { boshi: 0, oxiri: 0 }, ga: { oxiri: 1 }, dur: 0.7, ease: 'power2.out' });
    FM.trim(tl, halqa, DUR - 0.9, { dan: { boshi: 0, oxiri: 1, siljish: 0.62 }, ga: { boshi: 1, oxiri: 1 }, dur: 0.7, ease: 'power2.in' });
    tl.to([tx, tag], { opacity: 0, duration: 0.5, immediateRender: false }, DUR - 0.5);
  }
  window.__timelines['fx-maska'] = tl;
})();
</script>
</template>
</body></html>
