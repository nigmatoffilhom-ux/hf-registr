  const els = Array.from(host.querySelectorAll('[data-o]'));
  const maxO = Math.max.apply(null, els.map(e => Number(e.getAttribute('data-o')))) + 1;
  const bos = ch / maxO;                       // har bosqich davomi
  // boshlang'ich holat (seek-safe: hammasi timeline ichida)
  const dr = els.filter(e => e.classList.contains('dr'));
  gsap.set(dr, { strokeDasharray: '1 1', strokeDashoffset: 1, strokeLinecap: 'butt' });
  gsap.set(els.filter(e => !e.classList.contains('dr')), { opacity: 0 });
  if (sar) tl.fromTo(tt, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out', immediateRender: true }, kech * 0.5);
  els.forEach(e => {
    const k = Number(e.getAttribute('data-o')), t = kech + k * bos;
    if (e.classList.contains('dr')) {
      // uzunroq chiziq — sekinroq; bosqich ichida biroz surilish
      tl.to(e, { strokeDashoffset: 0, duration: bos * 0.9, ease: 'power1.inOut', immediateRender: false }, t);
      tl.set(e, { strokeLinecap: 'round' }, t + bos * 0.9);
    } else if (e.classList.contains('fl')) {
      tl.to(e, { opacity: 1, duration: bos * 0.8, ease: 'power1.out', immediateRender: false }, t + bos * 0.2);
    } else {
      tl.fromTo(e, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: bos * 0.6, ease: 'power2.out', immediateRender: false }, t + bos * 0.25);
    }
  });
  window.__timelines['fx-geo'] = tl;
})();
</script>
