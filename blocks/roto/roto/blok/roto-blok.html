<!doctype html>
<!--
  fx-roto — shaffof (alfa) videoni orqa fon ustiga qo'yadi (roto.py natijasi: roto.webm, VP9 + alpha).
  <div data-composition-id="fx-roto" data-composition-src="roto/blok/roto-blok.html"
       data-variable-values='{"video":"assets/mening-roto.webm","fon":"gradient","olcham":0.9,"soya":true}'
       data-start="0" data-duration="3" data-track-index="5" data-width="1920" data-height="1080"></div>
  Video yo'li LOYIHA ildiziga nisbatan (masalan assets/mening-roto.webm); bermasangiz blokning namuna-roto.webm i.
-->
<html data-composition-variables='[
  {"id":"video","type":"string","label":"Shaffof video (webm, LOYIHA ildiziga nisbatan)","default":"compositions/roto/blok/namuna-roto.webm"},
  {"id":"fon","type":"enum","label":"Orqa fon","default":"gradient","options":[{"value":"gradient","label":"Gradient"},{"value":"rang","label":"Bitta rang"},{"value":"rasm","label":"Rasm (fon_rasm)"},{"value":"yoq","label":"Fon yo`q (faqat shaffof)"}]},
  {"id":"rang1","type":"string","label":"Fon rangi 1","default":"#10224a"},
  {"id":"rang2","type":"string","label":"Fon rangi 2","default":"#05070d"},
  {"id":"fon_rasm","type":"string","label":"Fon rasmi (loyiha ildiziga nisbatan)","default":""},
  {"id":"olcham","type":"number","label":"Obyekt balandligi (kadr ulushi 0.2..1.3)","default":0.9},
  {"id":"ar","type":"number","label":"Video eni/bo`yi (9:16 = 0.5625, 16:9 = 1.7778)","default":0.5625},
  {"id":"x","type":"number","label":"Gorizontal markaz (0..1)","default":0.5},
  {"id":"y","type":"number","label":"Pastki chekka (0..1.2)","default":1.0},
  {"id":"soya","type":"boolean","label":"Soya (drop-shadow)","default":true},
  {"id":"nur","type":"boolean","label":"Orqada yumshoq nur","default":true},
  {"id":"kirish","type":"enum","label":"Kirish","default":"yuqoriga","options":[{"value":"yoq","label":"Yoq"},{"value":"yuqoriga","label":"Pastdan siljib kirish"},{"value":"opacity","label":"Yumshoq paydo bo`lish"}]}
]'>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
  #root{position:absolute;inset:0;overflow:hidden;font-family:Inter,Arial,sans-serif}
  .rt-fon{position:absolute;inset:0;background-size:cover;background-position:center}
  .rt-nur{position:absolute;left:50%;top:55%;width:70%;height:70%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(120,170,255,.38),rgba(120,170,255,0));pointer-events:none}
  .rt-v{position:absolute;overflow:visible}
  .rt-v video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent}
</style>
<div id="root" data-composition-id="fx-roto">
  <div class="rt-fon"></div>
  <div class="rt-nur"></div>
  <div class="rt-v"><video id="rt-video" class="rt-video" src="compositions/roto/blok/namuna-roto.webm" muted playsinline data-start="0"></video></div>
</div>
<script>
(function(){
  const V = window.__hyperframes.getVariables() || {};
  const root = document.querySelector('#root'), o = root.closest('[data-width]');
  const FW = Number(o && o.getAttribute('data-width')) || root.offsetWidth || 1920, FH = Number(o && o.getAttribute('data-height')) || root.offsetHeight || 1080;
  const DUR = Number(o && o.getAttribute('data-duration')) || 3;
  const fon = root.querySelector('.rt-fon'), nur = root.querySelector('.rt-nur'), box = root.querySelector('.rt-v'), vid = root.querySelector('.rt-video');
  const FONT = V.fon || 'gradient';
  if (FONT === 'yoq') fon.style.display = 'none';
  else if (FONT === 'rang') fon.style.background = V.rang1 || '#10224a';
  else if (FONT === 'rasm' && V.fon_rasm) fon.style.backgroundImage = 'url("' + V.fon_rasm + '")';
  else fon.style.background = 'linear-gradient(160deg,' + (V.rang1 || '#10224a') + ',' + (V.rang2 || '#05070d') + ')';
  if (V.nur === false || FONT === 'yoq') nur.style.display = 'none';
  vid.setAttribute('data-duration', String(DUR));
  vid.src = V.video || 'compositions/roto/blok/namuna-roto.webm';
  // o'lcham: video yuqorisi = kadr balandligi * olcham; proporsiya videoniki (kadr 16:9 bo'lsa ham obyekt kesilmaydi)
  const h = FH * (Number(V.olcham) || 0.9), w = h * (Number(V.ar) || 0.5625);   // ar = video eni/bo'yi (standart 9:16 manba)
  box.style.height = h + 'px'; box.style.width = w + 'px';
  box.style.left = (FW * (V.x != null ? Number(V.x) : 0.5) - w / 2) + 'px';
  box.style.top = (FH * (V.y != null ? Number(V.y) : 1.0) - h) + 'px';
  if (V.soya !== false) box.style.filter = 'drop-shadow(0 22px 28px rgba(0,0,0,.55))';
  const tl = gsap.timeline({ paused: true });
  const K = V.kirish || 'yuqoriga';
  if (K === 'yuqoriga') tl.fromTo(box, { y: h * 0.12, opacity: 0 }, { y: 0, opacity: 1, duration: .7, ease: 'power3.out' }, 0);
  else if (K === 'opacity') tl.fromTo(box, { opacity: 0 }, { opacity: 1, duration: .6, ease: 'power2.out' }, 0);
  tl.fromTo(nur, { opacity: 0 }, { opacity: 1, duration: .9, ease: 'power2.out' }, 0);
  window.__timelines['fx-roto'] = tl;
})();
</script>
</template>
</body></html>
