<!doctype html>
<!--
  fx-shader — WebGL "adjustment layer" (AE'dagi kabi): ostidagi qatlamga glow/bloom, blur, yo'nalishli blur,
  chromatic aberration, RGB split, turbulent displacement, levels/curves/saturatsiya, LUT, vinyetka, film grain.
  Host'ga ulash (manba = shu host'dan OLDINGI qo'shni qatlam yoki "manba" o'zgaruvchisi):
  <canvas class="sahna-k" layoutsubtree content="drawable" width="1920" height="1080" style="position:absolute;left:0;top:0;width:1920px;height:1080px">
    <div drawable style="position:absolute;left:0;top:0;width:1920px;height:1080px"> ...sahna (clip'lar ham)... </div>
  </canvas>
  <div data-composition-id="fx-shader" data-composition-src="compositions/shader/qatlam.html"
       data-variable-values='{"glow":0.9,"vinyetka":0.5,"don":0.25,"lut":"kino","kalitlar":[{"t":0,"blur":24},{"t":1.2,"blur":0}]}'
       data-start="0" data-duration="6" data-track-index="20" data-width="1920" data-height="1080"></div>
  Batafsil: _effektlar/shader/README.md (registrga kirmagan)
-->
<html data-composition-variables='[
  {"id":"manba","type":"string","label":"Manba: bo`sh = oldingi qatlam; #id; yoki assets/x.jpg","default":""},
  {"id":"buzish","type":"number","label":"Turbulent displacement (px)","default":0,"min":0,"step":1},
  {"id":"buzish_olcham","type":"number","label":"Displacement shovqin o`lchami (px)","default":220,"min":4,"step":1},
  {"id":"buzish_tezlik","type":"number","label":"Displacement tezligi","default":0.6,"step":0.05},
  {"id":"blur","type":"number","label":"Gaussian blur (px)","default":0,"min":0,"step":1},
  {"id":"yblur","type":"number","label":"Yo`nalishli blur uzunligi (px)","default":0,"min":0,"step":1},
  {"id":"yblur_burchak","type":"number","label":"Yo`nalishli blur burchagi (°)","default":0,"step":1},
  {"id":"glow","type":"number","label":"Glow/bloom kuchi","default":0,"min":0,"step":0.05},
  {"id":"glow_chegara","type":"number","label":"Glow chegarasi (0..1)","default":0.65,"min":0,"max":1,"step":0.01},
  {"id":"glow_radius","type":"number","label":"Glow radiusi (px)","default":40,"min":1,"step":1},
  {"id":"glow_rang","type":"color","label":"Glow rangi","default":"#ffffff"},
  {"id":"ekspozitsiya","type":"number","label":"Ekspozitsiya (stop)","default":0,"step":0.05},
  {"id":"qora","type":"number","label":"Levels: qora nuqta","default":0,"min":0,"max":1,"step":0.01},
  {"id":"oq","type":"number","label":"Levels: oq nuqta","default":1,"min":0,"max":1,"step":0.01},
  {"id":"gamma","type":"number","label":"Gamma","default":1,"min":0.1,"step":0.01},
  {"id":"kontrast","type":"number","label":"Kontrast","default":1,"min":0,"step":0.01},
  {"id":"egri","type":"number","label":"S-egri (curves, -1..1)","default":0,"step":0.05},
  {"id":"saturatsiya","type":"number","label":"Saturatsiya","default":1,"min":0,"step":0.01},
  {"id":"lut","type":"string","label":"LUT: kino/teal-orange/iliq/sovuq/oq-qora yoki yo`l .cube","default":""},
  {"id":"lut_kuch","type":"number","label":"LUT kuchi (0..1)","default":1,"min":0,"max":1,"step":0.01},
  {"id":"aberratsiya","type":"number","label":"Chromatic aberration (px, chetda)","default":0,"step":0.5},
  {"id":"rgb","type":"number","label":"RGB split (px)","default":0,"step":0.5},
  {"id":"rgb_burchak","type":"number","label":"RGB split burchagi (°)","default":0,"step":1},
  {"id":"vinyetka","type":"number","label":"Vinyetka (0..1)","default":0,"min":0,"max":1,"step":0.01},
  {"id":"vinyetka_yumshoq","type":"number","label":"Vinyetka yumshoqligi","default":0.75,"min":0.05,"max":1,"step":0.01},
  {"id":"don","type":"number","label":"Film grain (0..1)","default":0,"min":0,"step":0.01},
  {"id":"don_olcham","type":"number","label":"Don o`lchami (px)","default":1.6,"min":1,"step":0.1},
  {"id":"seed","type":"number","label":"Seed","default":1,"step":1},
  {"id":"ajrat","type":"number","label":"Oldin|keyin chizig`i (0 = yo`q, 0.5 = o`rtada)","default":0,"min":0,"max":1,"step":0.01},
  {"id":"kalitlar","type":"string","label":"Kalit kadrlar JSON: [{t,param,ease}]","default":""}
]'>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
  #root{position:absolute;inset:0;pointer-events:none}
  #root .sq-out{position:absolute;left:0;top:0;width:100%;height:100%}
</style>
<div id="root" data-composition-id="fx-shader">
  <canvas class="sq-out"></canvas>
  <a class="sq-yol" href="lut/kino.cube" hidden></a>
</div>
<script src="fxs.js"></script>
<script>
(function () {
  const G = globalThis;
  const V = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
  const r = document.querySelector('#root');
  const host = r.closest('[data-composition-src]') || r.parentElement;
  const olc = r.closest('[data-width]');
  const FW = Number(olc && olc.getAttribute('data-width')) || r.offsetWidth || 1920;
  const FH = Number(olc && olc.getAttribute('data-height')) || r.offsetHeight || 1080;
  const DUR = Number(host && host.getAttribute('data-duration')) || 5;
  const out = r.querySelector('.sq-out');
  const tl = gsap.timeline({ paused: true });
  tl.to({ v: 0 }, { v: 1, duration: DUR, ease: 'none' }, 0);

  // manba: bo'sh → host'dan oldingi qo'shni qatlam (AE adjustment layer kabi ostidagini oladi)
  let manba = V.manba || '';
  if (!manba) {
    for (let e = host && host.previousElementSibling; e; e = e.previousElementSibling) {
      if (/^(CANVAS|VIDEO|IMG)$/.test(e.tagName)) { manba = e; break; }
      const ichki = e.querySelector && e.querySelector('canvas[layoutsubtree],canvas[content="drawable"],video,img');
      if (ichki) { manba = ichki; break; }
    }
  } else if (/^[#.\[]/.test(manba)) {
    manba = G.document.querySelector(manba);
  }
  if (!manba) { console.warn('[fx-shader] manba topilmadi'); window.__timelines['fx-shader'] = tl; return; }

  // chiqish canvas'ni manba qutisiga joylash (comp pikselida)
  let W = FW, H = FH;
  if (typeof manba !== 'string') {
    const rr = r.getBoundingClientRect(), mr = manba.getBoundingClientRect();
    const k = rr.width ? r.offsetWidth / rr.width : 1;
    if (mr.width > 0 && mr.height > 0) {
      out.style.left = ((mr.left - rr.left) * k) + 'px'; out.style.top = ((mr.top - rr.top) * k) + 'px';
      out.style.width = (mr.width * k) + 'px'; out.style.height = (mr.height * k) + 'px';
      W = Math.round(mr.width * k); H = Math.round(mr.height * k);
    }
    if (manba.tagName === 'CANVAS') { W = manba.width; H = manba.height; }
  }
  const yolA = r.querySelector('.sq-yol');
  const p = {};
  Object.keys(FX.shaderStd).forEach(k => { if (V[k] !== undefined && V[k] !== '') p[k] = V[k]; });
  let ks = V.kalitlar;
  if (typeof ks === 'string' && ks.trim()) { try { ks = JSON.parse(ks); } catch (e) { console.warn('[fx-shader] kalitlar JSON emas'); ks = null; } }
  const L = FX.shader({
    manba, chiqish: out, W, H, p, root: r, compId: 'fx-shader',
    vaqt: () => tl.time(),
    lutYol: y => (/[\/.]/.test(y) ? y : yolA.href.replace(/kino\.cube$/, y + '.cube'))
  });
  if (ks && ks.length) FX.shaderKalitlar(tl, L.p, ks);
  window.__timelines['fx-shader'] = tl;
})();
</script>
</template>
</body>
</html>
